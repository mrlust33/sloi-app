<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SweetSpot - Крафтовые десерты</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <!-- Сброс кэша: версия 2.0 -->
    <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>

    <div id="main-screen">
        <div class="header">
            <h1 class="brand-title">SweetSpot</h1>
            <p id="sweet-subtitle">Ваш сладкий момент на сегодня ✨</p>
        </div>
        <div class="catalog" id="products-container"></div>
    </div>

    <!-- Общий оверлей для шторок -->
    <div class="overlay" id="overlay" onclick="closeAllSheets()"></div>

    <!-- ШТОРКА 1: КОРЗИНА -->
    <div class="bottom-sheet" id="cart-screen">
        <div class="drag-handle-area" id="drag-handle-cart">
            <div class="drag-handle"></div>
        </div>
        <div class="cart-header" id="cart-header-block">
            <h1 class="cart-title">Корзина</h1>
            <button class="clear-cart-btn" id="clear-cart-btn" onclick="clearCart(event)">Очистить</button>
        </div>
        
        <!-- СОСТОЯНИЕ 1: КОРЗИНА ЗАПОЛНЕНА -->
        <div id="cart-content-filled">
            <div id="cart-items-list"></div>
            
            <div class="cart-totals" id="cart-totals-block">
                <div class="total-row"><span>Товары</span><span id="cart-subtotal">0 ₽</span></div>
                <div class="total-row"><span>Доставка</span><span>0 ₽</span></div>
                <hr class="total-divider">
                <div class="total-row grand-total"><span>К оплате</span><span id="cart-grandtotal">0 ₽</span></div>
            </div>
            
            <button class="main-action-btn shimmer-btn" id="cart-main-action-btn" onclick="goToCheckout()">Перейти к оформлению</button>
        </div>

        <!-- СОСТОЯНИЕ 2: КОРЗИНА ПУСТАЯ -->
        <div id="cart-content-empty" class="cart-content-empty">
            <div class="empty-cart-center">
                <h2 class="empty-cart-title">Ваша корзина пуста 🧁</h2>
            </div>
            <button class="main-action-btn shimmer-btn" id="return-menu-btn" onclick="closeCartWithHaptic()">Вернуться в меню</button>
        </div>
    </div>

    <!-- ШТОРКА 2: ОФОРМЛЕНИЕ ЗАКАЗА -->
    <div class="bottom-sheet" id="checkout-screen">
        <div class="drag-handle-area" id="drag-handle-checkout">
            <div class="drag-handle"></div>
        </div>
        <div class="checkout-header">
            <h1 class="checkout-title">Доставка</h1>
            <p id="checkout-total">Сумма: 0 ₽</p>
        </div>
        
        <div class="input-group" id="name-input-group">
            <input type="text" id="username" placeholder="Ваше имя" required>
        </div>
        
        <div class="input-group">
            <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" placeholder="+7 (___) ___-__-__" maxlength="18" required>
        </div>
        <div class="input-group"><input type="text" id="street" placeholder="Улица (например, Летчика Ларюшина)" required></div>
        <div class="row">
            <div class="input-group"><input type="text" id="house" placeholder="Дом" required></div>
            <div class="input-group"><input type="number" id="entrance" placeholder="Подъезд" required></div>
        </div>
        <div class="row">
            <div class="input-group"><input type="number" id="floor" placeholder="Этаж" required></div>
            <div class="input-group"><input type="number" id="flat" placeholder="Квартира" required></div>
        </div>
        <div class="input-group"><input type="text" id="comment" placeholder="Комментарий курьеру"></div>
        
        <div class="delivery-time-trigger" id="trigger-btn" onclick="openPicker()">
            <span>📅 Дата и время доставки</span>
            <span id="delivery-time-value" class="placeholder">Указать... 🕒</span>
        </div>
        
        <button class="main-action-btn shimmer-btn" onclick="sendDataToBot()">Подтвердить заказ</button>
        <p class="marketing-trigger">✨ Десерты начнут готовиться сразу после подтверждения</p>
    </div>

    <!-- ПЛАВАЮЩАЯ КНОПКА КОРЗИНЫ -->
    <div class="floating-cart-btn shimmer-btn" id="floating-cart-btn" onclick="openCartSheet()">
        Посмотреть корзину &bull; <span id="cart-total-count">0</span> шт
    </div>

    <!-- ЦЕНТРИРОВАННЫЙ iOS POP-UP PICKER -->
    <div class="picker-overlay" id="picker-overlay" onclick="closePickerAndSave()"></div>
    <div class="picker-modal" id="picker-modal">
        <div class="picker-body">
            <div class="picker-highlight"></div>
            <div class="picker-column wheel-date" id="wheel-date"></div>
            <div class="picker-column wheel-time" id="wheel-hours"></div>
            <div class="picker-column wheel-time" id="wheel-minutes"></div>
        </div>
        <button class="picker-done-btn-bottom" onclick="closePickerAndSave()">Готово</button>
    </div>

    <!-- Сброс кэша: версия 2.0 -->
    <script src="script.js?v=2.0"></script>
</body>
</html>
