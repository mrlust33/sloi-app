<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SweetSpot - Крафтовые десерты</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <link rel="stylesheet" href="style.css?v=21.0">
    <style>
        /* Изоляция скролла */
        body.modal-active { overflow: hidden !important; position: fixed; width: 100%; height: 100%; touch-action: none; }
        
        /* Жесткая пиксельная шторка, без относительных единиц высоты */
        .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(14px); border-radius: 24px 24px 0 0; overflow-y: auto !important; touch-action: pan-y !important; -webkit-overflow-scrolling: touch !important; transition: transform 0.3s ease; transform: translateY(100%); z-index: 1000; }
        .bottom-sheet.active { transform: translateY(0); }
        
        /* Плашка Telegram-аккаунта */
        .tg-account-info { color: #10b981; font-weight: 600; font-size: 15px; padding: 16px; background: #ffffff; border-radius: 12px; border: 1.5px solid #10b981; font-family: 'Inter', sans-serif; display: none; margin-bottom: 12px;}
        
        /* Жесткие стили для карточек, фото и плашки ХИТ */
        .product-card { position: relative; }
        .image-container { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 12px; }
        .image-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .badge-hit { position: absolute; top: 12px; left: 12px; background: #ff69b4; color: #ffffff; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px; padding: 6px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .price-new { color: #1e1611 !important; font-weight: 800; }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="header">
            <h1 class="brand-title">SweetSpot</h1>
            <p id="sweet-subtitle">Ваш сладкий момент на сегодня ✨</p>
        </div>
        <!-- Каталог рендерится через JS с учетом новых стилей и цен -->
        <div class="catalog" id="products-container"></div>
    </div>

    <!-- Оверлей без preventDefault на скролл -->
    <div class="overlay" id="overlay" onclick="closeAllSheets()"></div>

    <!-- ШТОРКА 1: КОРЗИНА -->
    <div class="bottom-sheet" id="cart-screen">
        <div class="drag-handle-area" id="drag-handle-cart">
            <div class="drag-handle"></div>
        </div>
        <div class="cart-header" id="cart-header-block">
            <h1 class="cart-title">Корзина</h1>
            <button class="clear-cart-btn" id="clear-cart-btn" onclick="clearCart(event)">Очистить</button>
        </div>
        
        <div id="cart-content-filled">
            <div id="cart-items-list"></div>
            
            <div class="cart-totals" id="cart-totals-block">
                <div class="total-row"><span>Товары</span><span id="cart-subtotal">0 ₽</span></div>
                <div class="total-row"><span>Доставка</span><span>0 ₽</span></div>
                <hr class="total-divider">
                <div class="total-row grand-total"><span>К оплате</span><span id="cart-grandtotal">0 ₽</span></div>
            </div>
            
            <button class="main-action-btn shimmer-btn" id="cart-main-action-btn" onclick="goToCheckout()">Перейти к оформлению</button>
        </div>

        <div id="cart-content-empty" class="cart-content-empty">
            <div class="empty-cart-center">
                <h2 class="empty-cart-title">Ваша корзина пуста 🧁</h2>
            </div>
            <button class="main-action-btn shimmer-btn" id="return-menu-btn" onclick="closeCartWithHaptic()">Вернуться в меню</button>
        </div>
    </div>

    <!-- ШТОРКА 2: ОФОРМЛЕНИЕ ЗАКАЗА -->
    <div class="bottom-sheet" id="checkout-screen">
        <div class="drag-handle-area" id="drag-handle-checkout">
            <div class="drag-handle"></div>
        </div>
        <div class="checkout-header">
            <h1 class="checkout-title">Доставка</h1>
            <p id="checkout-total">Сумма: 0 ₽</p>
        </div>
        
        <div class="input-group" id="name-input-group">
            <div class="tg-account-info" id="tg-account-info"></div>
            <input type="text" id="username" placeholder="Ваше имя" required>
        </div>
        
        <div class="input-group">
            <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" placeholder="+7 (___) ___-__-__" maxlength="18" required>
        </div>
        <div class="input-group"><input type="text" id="street" placeholder="Улица (например, Летчика Ларюшина)" required></div>
        <div class="row">
            <div class="input-group"><input type="text" id="house" placeholder="Дом" required></div>
            <div class="input-group"><input type="text" id="entrance" placeholder="Подъезд"></div>
        </div>
        <div class="row">
            <div class="input-group"><input type="text" id="floor" placeholder="Этаж"></div>
            <div class="input-group"><input type="text" id="flat" placeholder="Квартира"></div>
        </div>
        <div class="input-group"><input type="text" id="comment" placeholder="Комментарий курьеру"></div>
        
        <div class="delivery-time-trigger" id="trigger-btn" onclick="openPicker()">
            <span>📅 Дата и время доставки</span>
            <span id="delivery-time-value" class="placeholder">Указать... 🕒</span>
        </div>
        
        <button class="main-action-btn shimmer-btn" id="submit-order-btn" onclick="sendDataToBot()" disabled style="opacity: 0.5; pointer-events: none;">Подтвердить заказ</button>
        <p class="marketing-trigger">✨ Десерты начнут готовиться сразу после подтверждения</p>
    </div>

    <!-- ШТОРКА 3: О ТОВАРЕ -->
    <div class="bottom-sheet product-info-sheet" id="product-info-screen">
        <div class="drag-handle-area" id="drag-handle-info">
            <div class="drag-handle"></div>
        </div>
        <div class="product-info-header">
            <div class="product-info-title-wrap">
                <h2 class="product-info-title" id="info-title">Название</h2>
                <div class="product-info-weight">500 г</div>
            </div>
            <div class="image-container" style="border-radius: 8px;">
                <img src="" class="product-info-image" id="info-img" alt="">
            </div>
        </div>
        <div class="product-info-desc" id="info-desc"></div>
        
        <h3 class="product-info-layers-title">Слои десерта</h3>
        <div class="layers-timeline" id="info-layers"></div>
        
        <button class="main-action-btn shimmer-btn" id="info-add-btn">Добавить в корзину</button>
    </div>

    <!-- ПЛАВАЮЩАЯ КНОПКА КОРЗИНЫ -->
    <div class="floating-cart-btn shimmer-btn" id="floating-cart-btn" onclick="openCartSheet()">
        Посмотреть корзину &bull; <span id="cart-total-count">0</span> шт
    </div>

    <!-- ЦЕНТРИРОВАННЫЙ iOS POP-UP PICKER -->
    <div class="picker-overlay" id="picker-overlay" onclick="closePickerAndSave()"></div>
    <div class="picker-modal" id="picker-modal">
        <div class="picker-body">
            <div class="picker-highlight"></div>
            <div class="picker-column wheel-date" id="wheel-date"></div>
            <div class="picker-column wheel-time" id="wheel-hours"></div>
            <div class="picker-column wheel-time" id="wheel-minutes"></div>
        </div>
        <button class="picker-done-btn-bottom" onclick="closePickerAndSave()">Готово</button>
    </div>

    <script src="script.js?v=21.0"></script>
</body>
</html>
