<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>СЛОИ - Крафтовые десерты</title>
    
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/motion@10.16.2/dist/motion.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.3.0/tsparticles.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    
    <style>
        /* Базовый сброс и плавность фона */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif; 
            margin: 0; padding: 0; 
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: background-color 0.8s ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }

        /* Контейнер для частиц на заднем плане */
        #tsparticles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* Обертка для контента поверх частиц */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Логотип */
        .brand-header {
            font-size: 32px; font-weight: 800; letter-spacing: -1px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        /* Карточка товара с эффектом стекла (Glassmorphism) */
        .product-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            transform-style: preserve-3d; /* Для Vanilla-Tilt */
            will-change: transform, opacity, filter;
        }

        .product-image {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 18px;
            transform: translateZ(30px); /* 3D вылет картинки */
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .product-info {
            text-align: center;
            margin-top: 20px;
            transform: translateZ(20px);
        }

        .product-info h3 {
            margin: 0 0 8px 0; font-size: 22px; font-weight: 800; color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .product-info p {
            margin: 0; font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.9);
        }

        /* Премиум кнопка добавления */
        .add-btn {
            background: #ffffff; color: #000000;
            border: none; padding: 14px 32px; border-radius: 100px;
            font-size: 16px; font-weight: 800; cursor: pointer;
            margin-top: 20px; width: 100%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            transform: translateZ(25px);
        }
        .add-btn:active { transform: translateZ(25px) scale(0.95); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* Навигация (переключатели вкусов) */
        .nav-controls {
            display: flex; gap: 16px; margin-top: 30px;
        }
        .nav-btn {
            background: rgba(255,255,255,0.3); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5); border-radius: 50%;
            width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 24px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.15s ease, background 0.3s;
        }
        .nav-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.5); }

    </style>
</head>
<body>

    <!-- Фон с дождем из ягод -->
    <div id="tsparticles"></div>

    <!-- Интерфейс -->
    <div class="app-container">
        <div class="brand-header">СЛОИ</div>
        
        <!-- Карточка генерируется здесь -->
        <div id="card-wrapper" style="width: 100%;"></div>

        <!-- Кнопки свайпа/переключения -->
        <div class="nav-controls">
            <button class="nav-btn" onclick="prevFlavor()">❮</button>
            <button class="nav-btn" onclick="nextFlavor()">❯</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.disableVerticalSwipes(); // Блокируем свайпы телеги, чтобы не мешали нашему 3D

        const { animate } = Motion;

        // База данных вкусов с привязанными цветами и эмодзи
        const flavors = [
            { id: 1, name: "Трайфл «Банан-Клубника»", price: 1500, img: "banan.jpg", bg: "#d97706", emojis: ["🍌", "🍓"] },
            { id: 2, name: "Трайфл «Вишня с шоколадом»", price: 1500, img: "vishny.jpg", bg: "#4c0519", emojis: ["🍒", "🍫"] },
            { id: 3, name: "Трайфл «Клубника»", price: 1500, img: "klubnika.jpg", bg: "#be185d", emojis: ["🍓"] }
        ];

        let currentIndex = 0;
        let tsParticlesInstance = null;

        // 1. Инициализация дождя эмодзи (tsParticles)
        async function loadParticles(emojis) {
            const config = {
                fpsLimit: 60,
                particles: {
                    number: { value: 15, density: { enable: true, value_area: 800 } },
                    shape: {
                        type: "char",
                        character: { value: emojis, font: "Verdana", style: "", weight: "400", fill: true }
                    },
                    size: { value: 25, random: true },
                    move: {
                        enable: true,
                        speed: 3,
                        direction: "bottom",
                        random: false,
                        straight: false,
                        outModes: { default: "out" }
                    },
                    rotate: {
                        value: { min: 0, max: 360 },
                        direction: "random",
                        animation: { enable: true, speed: 10 }
                    },
                    opacity: { value: 0.8 }
                },
                detectRetina: true
            };

            if (tsParticlesInstance) {
                // Если фон уже есть — мягко меняем эмодзи
                tsParticlesInstance.options.particles.shape.character.value = emojis;
                tsParticlesInstance.refresh();
            } else {
                tsParticlesInstance = await tsParticles.load({ id: "tsparticles", options: config });
            }
        }

        // 2. Рендер и 3D-анимация карточки (Motion One + Vanilla Tilt)
        async function renderCard(direction = 1) {
            const flavor = flavors[currentIndex];
            const wrapper = document.getElementById("card-wrapper");

            // Меняем цвет фона плавно
            document.body.style.backgroundColor = flavor.bg;
            
            // Запускаем дождь из новых ягод
            loadParticles(flavor.emojis);

            // Анимация ИСЧЕЗНОВЕНИЯ старой карточки (если она есть)
            if (wrapper.children.length > 0) {
                const oldCard = wrapper.children[0];
                // Разрушаем старый Tilt, чтобы не жрал память
                if (oldCard.vanillaTilt) oldCard.vanillaTilt.destroy();
                
                await animate(oldCard, 
                    { opacity: 0, scale: 0.8, filter: "blur(15px)", x: direction * -50 }, 
                    { duration: 0.3, easing: "ease-in" }
                ).finished;
                wrapper.innerHTML = '';
            }

            // Создаем новую карточку
            const card = document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
                <img src="${flavor.img}" class="product-image" alt="${flavor.name}">
                <div class="product-info">
                    <h3>${flavor.name}</h3>
                    <p>${flavor.price} ₽</p>
                    <button class="add-btn" onclick="addToCart()">В корзину</button>
                </div>
            `;
            
            // Изначально скрываем новую карточку
            card.style.opacity = 0;
            card.style.transform = `scale(0.8) translateX(${direction * 50}px)`;
            card.style.filter = "blur(15px)";
            wrapper.appendChild(card);

            // Анимация ПОЯВЛЕНИЯ новой карточки (Motion One)
            await animate(card, 
                { opacity: 1, scale: 1, filter: "blur(0px)", x: 0 }, 
                { duration: 0.5, easing: [0.175, 0.885, 0.32, 1.275] } // Spring effect
            ).finished;

            // Накидываем сочный 3D-эффект на свежую карточку (Vanilla Tilt)
            VanillaTilt.init(card, {
                max: 15,
                speed: 400,
                glare: true,
                "max-glare": 0.3,
                gyroscope: true // Реагирует на наклон самого смартфона
            });
        }

        // Логика переключения
        function nextFlavor() {
            tg.HapticFeedback.selectionChanged();
            currentIndex = (currentIndex + 1) % flavors.length;
            renderCard(1);
        }

        function prevFlavor() {
            tg.HapticFeedback.selectionChanged();
            currentIndex = (currentIndex - 1 + flavors.length) % flavors.length;
            renderCard(-1);
        }

        function addToCart() {
            tg.HapticFeedback.impactOccurred('medium');
            // Здесь будет логика добавления в корзину. Пока просто вибро-отклик.
            tg.MainButton.setText("Товар добавлен (1500 ₽)");
            tg.MainButton.show();
            setTimeout(() => tg.MainButton.hide(), 2000);
        }

        // Инициализация при старте
        window.onload = () => renderCard(1);

    </script>
</body>
</html>
